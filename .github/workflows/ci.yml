name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are superseded; every main commit keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job id/name is the required status check on the protected main. Don't rename it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Browsers are keyed on the installed Playwright version. The install always runs:
      # it skips browsers restored from the cache, and OS deps aren't cacheable anyway.
      # Separate assignment so a failing node -p fails the step instead of writing an empty key.
      - id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Every project runs headless, so the headless shell is the only browser needed
      - run: npx playwright install --with-deps --only-shell chromium

      - run: npm run test:e2e

      # Also on success: a test that passed on retry still leaves its traces in the report
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
